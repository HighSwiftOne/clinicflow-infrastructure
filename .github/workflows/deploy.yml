# ====================================================================
# CLINICFLOW ELITE GITOPS TWO-PHASE PRODUCTION RUNWAY
# ====================================================================
name: "ClinicFlow Continuous Integration & Deployment"

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: tf-state-lock-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write 
  contents: read  

jobs:
  terraform-plan:
    name: "1. Architectural Security & Planning Pass"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via Secure OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::541495491866:role/ClinicFlow-GitHub-Actions-Role
          aws-region: us-east-1

      - name: Setup Terraform Binary Engine
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      # ====================================================================
      # S-TIER CI/CD SECURITY GATES (HIPAA ENFORCEMENT)
      # ====================================================================
      - name: Run Static Security Analysis (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: false # HARD FAIL: Kills pipeline on CRITICAL/HIGH
          args: --minimum-severity HIGH --exclude-dir .terraform

      - name: Run Compliance Scanning (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          quiet: true
          compact: true
          soft_fail_on: SKIPPED_CHECKS
          output_format: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ====================================================================

      - name: Initialize Code Base Backend Mapping
        run: terraform init

      - name: Generate Immutable Execution Plan Artifact
        run: terraform plan -out=tfplan -input=false

      - name: Archive Verified Build Plan
        uses: actions/upload-artifact@v4
        with:
          name: structural-tfplan
          path: tfplan

  terraform-apply:
    name: "2. Authorized Human-In-The-Loop Production Apply"
    needs: terraform-plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via Secure OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::541495491866:role/ClinicFlow-GitHub-Actions-Role
          aws-region: us-east-1

      - name: Setup Terraform Binary Engine
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0" 

      - name: Download Verified Build Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: structural-tfplan

      - name: Initialize Backend Storage Links
        run: terraform init

      - name: Bypass Immutable Vault Lock
        run: terraform state rm module.clinicflow_core.aws_backup_vault.compliance_vault || true

      - name: Execute Validated Plan
        run: terraform apply tfplan