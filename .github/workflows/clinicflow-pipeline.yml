# ====================================================================
# CLINICFLOW VENDING MACHINE HARDENED RUNWAY
# ====================================================================
name: "Production Vending Machine"

on:
  workflow_dispatch: # Restricted to manual corporate operator triggers

permissions:
  id-token: write
  contents: read

jobs:
  vending-plan:
    name: "Architectural Vending Plan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via Secure OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::541495491866:role/ClinicFlow-GitHub-Actions-Role
          aws-region: us-east-1

      - name: Setup Terraform Binary Engine
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Initialize Backend Storage Links
        run: terraform init

      # FIXED: Blind auto-approve loop eradicated. Generates an immutable plan artifact for explicit human engineering review.
      - name: Generate Secure Vending Plan
        run: terraform plan -out=vendingplan -input=false